<!-- Es usar etiquetas que describen el significado del contenido, no solo su apariencia, ayuda a otros desarrolladores a enteder el codigo.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Semántico</title>
</head>
<body>
    <header>           <!-- Es el encabezado de la pagina (puede haber mas de uno) -->
        <nav>          <!-- herrameinta para navegar -->
            <ul>
                <li> <a href="#">A</a> </li>
                <li> <a href="#">A</a> </li>
                <li> <a href="#">A</a> </li>        <!-- ← tipico menu de navegacion -->
                <li> <a href="#">A</a> </li>
                <li> <a href="#">A</a> </li>
            </ul>
        </nav>
    </header>

    <section class="noticias"> <!-- Suele hacer referencia a una seccion del contenido (Ej: Seccion de noticias) -->

    </section>

    <main> <!-- Es el contenido principal de la pagina, la parte principal de nuestra web !!¡¡-->
        <section></section> <!-- Suele haber mas de una seccion -->
    </main>

    <aside></aside> <!-- Seccion secundaria, aun esta relacionada con el contenido -->

    <footer></footer> <!-- sección inferior que actúa como pie de página (EJ: esta pagina esta protegida por derechos de autor.)-->

</body>
</html>

<!--
1. <header></header>
2. <main></main>
3. <section></section>
4. <aside></aside>
5. <nav></nav>
6. <footer></footer>
-->
